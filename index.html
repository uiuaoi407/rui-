<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>전가서의 신과일 6단계 짤방 챌린지!</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #1a1a1a; color: white; text-align: center; margin: 0; overflow: hidden; touch-action: none; }
        h1 { margin: 8px 0; font-size: 20px;}
        #game-container { position: relative; width: 90vw; max-width: 450px; height: 70vh; background: #222; margin: 10px auto; border: 3px solid #555; border-radius: 10px; overflow: hidden; }
        #player { 
            position: absolute; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 80px; 
            height: 80px; 
            z-index: 10; 
            background-size: cover; 
            background-position: center; 
            border-radius: 50%; 
            border: 4px solid white; 
            box-shadow: 0 0 20px rgba(255,255,255,0.8); 
            transition: width 0.2s, height 0.2s, transform 0.1s; 
        }
        .fruit { position: absolute; font-size: 24px; top: -50px; text-align: center; z-index: 5; }
        
        .bonus-star {
            position: absolute;
            width: 45px;
            height: 45px;
            top: -50px;
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            border: 2px solid gold;
            box-shadow: 0 0 15px gold;
            z-index: 5;
        }

        #score-board { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        
        #watermark {
            position: absolute;
            bottom: 10px;
            right: 12px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
            z-index: 15;
            letter-spacing: -0.5px;
        }

        #flash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        /* 💡 첫 시작 화면 및 게임오버 공용 오버레이창 */
        .screen-overlay { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background-size: cover; 
            background-position: center;
            background-color: rgba(0,0,0,0.85);
            background-blend-mode: overlay;
            display: flex; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30; 
        }
        .screen-overlay h2 { font-size: 32px; color: #ff4757; text-shadow: 2px 2px 4px black; margin: 0 0 10px 0; }
        .screen-overlay p { font-size: 18px; font-weight: bold; text-shadow: 2px 2px 4px black; margin: 0 0 20px 0; color: #fff; }
        button { padding: 15px 40px; font-size: 20px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 10px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <h1>🍋 전가서 신과일 챌린지 🍋</h1>
    <div id="score-board">점수: <span id="score">0</span> | 연속 놓침: <span id="miss">0</span>/5</div>
    <audio id="bgm" src="배경음악.mp3" loop></audio>
    <div id="game-container">
        <div id="player"></div>
        <div id="watermark">모카크림의 밤산책</div>
        <div id="flash-overlay"></div>
        
        <!-- 💡 첫 시작 버튼 화면 (음악 버그 완벽 해결용!) -->
        <div id="start-screen" class="screen-overlay">
            <h2>전가서 챌린지</h2>
            <p>준비되면 버튼을 눌러주세요!</p>
            <button onclick="startGame()">게임 시작!</button>
        </div>

        <!-- 게임오버 화면 -->
        <div id="game-over" class="screen-overlay" style="display: none;">
            <h2>기절 😵</h2>
            <p id="final-score">최종 점수: 0</p>
            <button onclick="location.reload()">다시 도전</button>
        </div>
    </div>

<script>
    const container = document.getElementById("game-container");
    const player = document.getElementById("player");
    const scoreEl = document.getElementById("score");
    const missEl = document.getElementById("miss");
    const startScreen = document.getElementById("start-screen");
    const gameOverEl = document.getElementById("game-over");
    const flashOverlay = document.getElementById("flash-overlay");
    const finalScoreEl = document.getElementById("final-score");
    const bgm = document.getElementById("bgm");

    let score = 0, consecutiveMiss = 0, isGameStarted = false, isGameOver = false;
    let flashTimer = null, fruitInterval = null;
    const ruiImages = { normal: 'normal.jpg', level1: 'level1.jpg', level2: 'level2.jpg', level3: 'level3.jpg', pain: 'pain.jpg', ending: 'ending.jpg', star: 'ruirui.jpg' };
    player.style.backgroundImage = `url('${ruiImages.normal}')`;

    function movePlayer(clientX) {
        if (!isGameStarted || isGameOver) return;
        const rect = container.getBoundingClientRect();
        const currentWidth = player.offsetWidth;
        let x = clientX - rect.left - (currentWidth / 2);
        x = Math.max(0, Math.min(x, rect.width - currentWidth));
        player.style.left = x + "px";
        player.style.transform = "none";
    }
    container.addEventListener("mousemove", (e) => movePlayer(e.clientX));
    container.addEventListener("touchmove", (e) => { e.preventDefault(); movePlayer(e.touches[0].clientX); }, {passive: false});

    // 💡 첫 시작 버튼 누를 때 음악 재생 + 게임 루프 실행
    function startGame() {
        isGameStarted = true;
        startScreen.style.display = "none";
        bgm.play().catch(() => {});
        fruitInterval = setInterval(createFruit, 900);
    }

    function createFruit() {
        if (isGameOver || !isGameStarted) return;
        const item = document.createElement("div");
        const rand = Math.random();
        
        let type;
        // 💡 확률을 약 1.5% (약 1분마다 1번 꼴)로 대폭 낮춤!
        if (rand < 0.015) {
            item.classList.add("bonus-star");
            item.style.backgroundImage = `url('${ruiImages.star}')`;
            type = { score: 100, speed: 11, isBonus: true };
        } else {
            item.classList.add("fruit");
            let fruitRand = Math.random();
            type = fruitRand < 0.5 ? { emoji: '🍍', score: 10, speed: 5, stage: 'level1' } :
                   fruitRand < 0.8 ? { emoji: '🍑🍑', score: 20, speed: 6, stage: 'level2' } :
                   fruitRand < 0.95 ? { emoji: '🥝🥝🥝', score: 50, speed: 7, stage: 'level3' } :
                   { emoji: '🍎🍎🍎🍎', score: -100, speed: 10, stage: 'pain', isPain: true };
            item.innerText = type.emoji;
        }

        item.style.left = Math.random() * (container.offsetWidth - 40) + "px";
        container.appendChild(item);

        let itemY = -50;
        const fall = setInterval(() => {
            if (isGameOver) { clearInterval(fall); return; }
            itemY += type.speed;
            item.style.top = itemY + "px";
            const pRect = player.getBoundingClientRect(), iRect = item.getBoundingClientRect();
            
            if (iRect.left < pRect.right && iRect.right > pRect.left && iRect.top < pRect.bottom && iRect.bottom > pRect.top) {
                if (type.isPain) { 
                    endGame(); 
                } else { 
                    score += type.score; 
                    scoreEl.innerText = score; 
                    
                    if (type.isBonus) {
                        triggerFlashEffect();
                    } else {
                        consecutiveMiss = 0;
                        missEl.innerText = consecutiveMiss;
                    }
                    
                    let bonusSize = Math.min(80 + Math.floor(score / 1000) * 15, 160);
                    player.style.width = bonusSize + "px";
                    player.style.height = bonusSize + "px";

                    let stageImg = type.isBonus ? 'level3' : type.stage;
                    player.style.backgroundImage = `url('${ruiImages[stageImg]}')`; 
                    setTimeout(() => player.style.backgroundImage = `url('${ruiImages.normal}')`, 300); 
                }
                container.removeChild(item); clearInterval(fall);
            }
            
            if (itemY > container.offsetHeight) { 
                container.removeChild(item); 
                clearInterval(fall);
                
                if (!type.isPain && !type.isBonus) {
                    consecutiveMiss++;
                    missEl.innerText = consecutiveMiss;
                    if (consecutiveMiss >= 5) {
                        endGame();
                    }
                }
            }
        }, 20);
    }

    function triggerFlashEffect() {
        flashOverlay.style.backgroundImage = `url('${ruiImages.star}')`;
        flashOverlay.style.opacity = "0.85"; 
        
        if (flashTimer) clearTimeout(flashTimer);
        
        flashTimer = setTimeout(() => {
            flashOverlay.style.opacity = "0";
        }, 5000);
    }

    function endGame() {
        isGameOver = true;
        bgm.pause();
        clearInterval(fruitInterval);
        flashOverlay.style.opacity = "0"; 
        gameOverEl.style.backgroundImage = `url('${ruiImages.ending}')`;
        gameOverEl.style.display = "flex"; 
        finalScoreEl.innerText = "최종 점수: " + score;
    }
</script>
</body>
</html>
