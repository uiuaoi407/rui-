<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>전가서의 신과일 6단계 짤방 챌린지!</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a1a1a;
            color: white;
            text-align: center;
            margin: 0;
            overflow: hidden;
        }
        h1 { margin: 8px 0; font-size: 24px;}
        #game-container {
            position: relative;
            width: 450px;
            height: 700px;
            background: #222;
            margin: 10px auto;
            border: 3px solid #555;
            border-radius: 10px;
            overflow: hidden;
            cursor: none;
        }
        #player {
            position: absolute;
            bottom: 30px;
            left: 177.5px;
            width: 95px;
            height: 95px;
            z-index: 10;
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
            transition: transform 0.1s, border-color 0.2s, box-shadow 0.2s;
        }
        .player-pain {
            border-color: #e74c3c !important;
            box-shadow: 0 0 30px #e74c3c !important;
            transform: scale(1.1);
        }
        .fruit {
            position: absolute;
            font-size: 28px;
            top: -50px;
            text-align: center;
            line-height: 1.1;
            text-shadow: 0 0 8px rgba(0,0,0,0.7);
        }
        #score-board {
            font-size: 22px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 40px;
            border-radius: 20px;
            display: none;
            z-index: 20;
        }
        #game-over h2 { font-size: 40px; margin: 0; color: #e74c3c; }
        #final-score { font-size: 24px; margin: 10px 0; }
        button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 20px;
            cursor: pointer;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

    <h1>🍋 전가서 신과일 챌린지: 풀코스 🍋</h1>
    <div id="score-board">점수: <span id="score">0</span> | 최고: <span id="high-score">0</span></div>
    
    <!-- 배경음악 -->
    <audio id="bgm" src="배경음악.mp3" loop></audio>

    <div id="game-container">
        <div id="player"></div>
        
        <div id="game-over">
            <h2>기절 😵</h2>
            <p id="final-score">최종 점수: 0</p>
            <button onclick="restartGame()">다시 도전</button>
        </div>
    </div>

<script>
    const container = document.getElementById("game-container");
    const player = document.getElementById("player");
    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("high-score");
    const gameOverEl = document.getElementById("game-over");
    const finalScoreEl = document.getElementById("final-score");
    const bgm = document.getElementById("bgm");

    let score = 0;
    let highScore = 0;
    let fruitInterval;
    let difficultyInterval;
    let isGameOver = false;
    let playerX = 177.5;
    let currentImageSet = 'normal';

    const ruiImages = {
        normal: 'normal.jpg',
        level1: 'level1.jpg',
        level2: 'level2.jpg',
        level3: 'level3.jpg',
        pain:   'pain.jpg',
        ending: 'ending.jpg'
    };

    player.style.backgroundImage = `url('${ruiImages.normal}')`;

    container.addEventListener("mousemove", (e) => {
        if (isGameOver) return;
        const rect = container.getBoundingClientRect();
        playerX = e.clientX - rect.left - 47.5; 
        if (playerX < 0) playerX = 0;
        if (playerX > 355) playerX = 355;
        player.style.left = playerX + "px";
    });

    function createFruit() {
        if (isGameOver) return;
        const fruit = document.createElement("div");
        fruit.classList.add("fruit");
        
        const rand = Math.random();
        let type;
        
        // 💡 1단계: 파인애플 🍍 / 2단계: 복숭아 🍑🍑 / 3단계: 키위 🥝🥝🥝 / 4단계: 사과,오렌지 4개
        if (rand < 0.5) {
            type = { emoji: '🍍', count: 1, score: 10, speed: 5, stage: 'level1' };
        } else if (rand < 0.8) {
            type = { emoji: '🍑🍑', count: 2, score: 20, speed: 6, stage: 'level2' };
        } else if (rand < 0.95) {
            type = { emoji: '🥝🥝🥝', count: 3, score: 50, speed: 7, stage: 'level3' };
        } else {
            const badFruit = Math.random() < 0.5 ? '🍎🍎🍎🍎' : '🍊🍊🍊🍊';
            type = { emoji: badFruit, count: 4, score: -100, speed: 10, stage: 'pain', isPain: true };
        }

        fruit.innerText = type.emoji;
        fruit.dataset.score = type.score;
        fruit.dataset.isPain = type.isPain;
        fruit.dataset.stage = type.stage;
        fruit.style.left = Math.random() * 380 + "px";
        container.appendChild(fruit);

        let fruitY = -50;
        const fallInterval = setInterval(() => {
            if (isGameOver) { clearInterval(fallInterval); return; }
            fruitY += type.speed;
            fruit.style.top = fruitY + "px";
            if (fruitY > 700) { container.removeChild(fruit); clearInterval(fallInterval); }

            const playerRect = player.getBoundingClientRect();
            const fruitRect = fruit.getBoundingClientRect();
            if (fruitRect.left < playerRect.right && fruitRect.right > playerRect.left &&
                fruitRect.top < playerRect.bottom && fruitRect.bottom > playerRect.top) {
                collectedFruit(type);
                container.removeChild(fruit);
                clearInterval(fallInterval);
            }
        }, 20);
    }

    function collectedFruit(type) {
        if (type.isPain) {
            gotPainFruit();
        } else {
            score += type.score;
            scoreEl.innerText = score;
            updatePlayerFace(type.stage);
        }
    }

    function updatePlayerFace(stage) {
        currentImageSet = stage;
        player.style.backgroundImage = `url('${ruiImages[stage]}')`;
        player.classList.remove("player-pain");

        setTimeout(() => {
            if(!isGameOver && currentImageSet === stage) {
                player.style.backgroundImage = `url('${ruiImages.normal}')`;
                currentImageSet = 'normal';
            }
        }, 300);
    }

    function gotPainFruit() {
        isGameOver = true;
        clearInterval(fruitInterval);
        clearInterval(difficultyInterval);
        
        bgm.pause();

        player.style.backgroundImage = `url('${ruiImages.pain}')`;
        player.classList.add("player-pain");

        setTimeout(() => {
            player.style.backgroundImage = `url('${ruiImages.ending}')`;
            player.classList.remove("player-pain");
            showGameOver();
        }, 2500);
    }

    function showGameOver() {
        if (score > highScore) {
            highScore = score;
            highScoreEl.innerText = highScore;
        }
        finalScoreEl.innerText = "최종 점수: " + score;
        gameOverEl.style.display = "block";
    }

    function startGame() {
        score = 0;
        isGameOver = false;
        currentImageSet = 'normal';
        scoreEl.innerText = score;
        gameOverEl.style.display = "none";
        player.style.backgroundImage = `url('${ruiImages.normal}')`;
        player.classList.remove("player-pain");
        player.style.left = "177.5px";

        bgm.currentTime = 0;
        bgm.play().catch(e => {});

        let intervalTime = 1000; 
        fruitInterval = setInterval(createFruit, intervalTime);
        
        difficultyInterval = setInterval(() => {
            if(intervalTime > 250) intervalTime -= 50;
            clearInterval(fruitInterval);
            fruitInterval = setInterval(createFruit, intervalTime);
        }, 6000);
    }

    function restartGame() {
        const fruits = document.querySelectorAll('.fruit');
        fruits.forEach(fruit => fruit.remove());
        startGame();
    }

    document.addEventListener("click", () => {
        if(bgm.paused && !isGameOver && score === 0) {
            bgm.play().catch(e => {});
        }
    }, { once: true });

    startGame();

</script>

</body>
</html>
