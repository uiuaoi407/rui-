<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>전가서의 신과일 6단계 짤방 챌린지!</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #000; color: white; text-align: center; margin: 0; overflow: hidden; touch-action: none; }
        h1 { margin: 8px 0; font-size: 20px;}
        
        #game-container { 
            position: relative; width: 90vw; max-width: 450px; height: 70vh; 
            background-color: #000; margin: 10px auto; border: 3px solid #555; border-radius: 10px; overflow: hidden; 
            background-size: cover; background-position: center; transition: background-image 0.5s ease;
        }
        
        /* 💡 1. 루이 사진을 확실하게 띄울 레이어 */
        #flash-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center; opacity: 0; pointer-events: none;
            z-index: 20; transition: opacity 0.3s;
        }

        #player { 
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 80px; height: 80px; z-index: 10; 
            background-size: cover; background-position: center; border-radius: 50%; border: 4px solid white; box-shadow: 0 0 20px rgba(255,255,255,0.8);
            transition: width 0.2s, height 0.2s, transform 0.1s, background-image 0.1s; 
        }
        .fruit { position: absolute; font-size: 24px; top: -50px; text-align: center; z-index: 5; }
        .bonus-star { position: absolute; width: 45px; height: 45px; top: -50px; background-size: cover; border-radius: 50%; border: 2px solid gold; box-shadow: 0 0 15px gold; z-index: 5; }

        #score-board { font-size: 16px; font-weight: bold; margin-bottom: 5px; z-index: 2; position: relative; }
        #watermark { position: absolute; bottom: 10px; right: 12px; color: rgba(255, 255, 255, 0.6); font-size: 12px; z-index: 6; pointer-events: none; }

        .screen-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0, 0.6);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 30; 
        }
        button { padding: 15px 40px; font-size: 20px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🍋 전가서 신과일 챌린지 🍋</h1>
    <div id="score-board">점수: <span id="score">0</span> | 연속 놓침: <span id="miss">0</span>/5</div>
    <audio id="bgm" src="배경음악.mp3" loop></audio>
    <div id="game-container">
        <div id="player"></div>
        <div id="flash-overlay"></div> <!-- 루이 사진 띄울 곳 -->
        <div id="watermark">모카크림의 밤산책</div>
        <div id="start-screen" class="screen-overlay">
            <h2>전가서 챌린지</h2>
            <button onclick="firstStartGame()">게임 시작!</button>
        </div>
        <div id="game-over" class="screen-overlay" style="display: none;">
            <h2>기절 😵</h2>
            <p id="final-score"></p>
            <button onclick="restartGame()">다시 시작하기</button>
        </div>
    </div>

<script>
    const container = document.getElementById("game-container"), player = document.getElementById("player"), scoreEl = document.getElementById("score"), missEl = document.getElementById("miss");
    const flashOverlay = document.getElementById("flash-overlay"), bgm = document.getElementById("bgm");
    const bgImages = ['normal.jpg', 'level1.jpg', 'level2.jpg', 'level3.jpg'];
    const ruiImages = { normal: 'normal.jpg', level1: 'level1.jpg', level2: 'level2.jpg', level3: 'level3.jpg', pain: 'pain.jpg', ending: 'ending.jpg', star: 'ruirui.jpg' };
    let score = 0, consecutiveMiss = 0, isGameRunning = false, flashTimer = null, fruitInterval = null;

    function playBgm() { bgm.pause(); bgm.currentTime = 0; bgm.play().catch(() => {}); }
    function firstStartGame() { document.getElementById("start-screen").style.display = "none"; playBgm(); runGame(); }
    function restartGame() { document.getElementById("game-over").style.display = "none"; playBgm(); runGame(); }

    function runGame() {
        score = 0; consecutiveMiss = 0; scoreEl.innerText = "0"; missEl.innerText = "0";
        isGameRunning = true; container.style.backgroundImage = `url('${bgImages[0]}')`;
        if (fruitInterval) clearInterval(fruitInterval);
        fruitInterval = setInterval(createFruit, 900);
    }

    function createFruit() {
        if (!isGameRunning) return;
        
        // 💡 2. 500점마다 무한 로테이션 (0~3 인덱스 반복)
        let bgIdx = Math.floor(score / 500) % bgImages.length;
        container.style.backgroundImage = `url('${bgImages[bgIdx]}')`;

        const item = document.createElement("div");
        if (Math.random() < 0.015) {
            item.classList.add("bonus-star");
            item.style.backgroundImage = `url('${ruiImages.star}')`;
            item.onclick = () => {
                score += 100; scoreEl.innerText = score;
                triggerFlash(); // 💡 1. 루이 사진 띄우고 5초간 번쩍임
                container.removeChild(item);
            };
            type = { speed: 11, isBonus: true };
        } else {
            item.classList.add("fruit");
            let r = Math.random();
            item.innerText = r < 0.5 ? '🍍' : r < 0.8 ? '🍑' : r < 0.95 ? '🥝' : '🍎';
            type = { speed: r < 0.95 ? 6 : 10, isPain: r >= 0.95 };
        }

        item.style.left = Math.random() * (container.offsetWidth - 40) + "px";
        container.appendChild(item);

        let y = -50;
        const fall = setInterval(() => {
            if (!isGameRunning) { clearInterval(fall); return; }
            y += type.speed; item.style.top = y + "px";
            // 간단 충돌 체크
            const p = player.getBoundingClientRect(), i = item.getBoundingClientRect();
            if (i.top > p.top && i.left > p.left && i.right < p.right) {
                if (type.isPain) endGame();
                else if (!type.isBonus) { score += 10; scoreEl.innerText = score; container.removeChild(item); clearInterval(fall); }
            }
            if (y > container.offsetHeight) { container.removeChild(item); clearInterval(fall); if(!type.isBonus && !type.isPain) { consecutiveMiss++; missEl.innerText = consecutiveMiss; if(consecutiveMiss >= 5) endGame(); } }
        }, 20);
    }

    // 💡 1. 5초간 번쩍이는 로직
    function triggerFlash() {
        flashOverlay.style.backgroundImage = `url('${ruiImages.star}')`;
        let count = 0;
        let blink = setInterval(() => {
            flashOverlay.style.opacity = (count % 2 === 0) ? "0.8" : "0.3";
            count++;
            if (count > 10) { clearInterval(blink); flashOverlay.style.opacity = "0"; }
        }, 500); // 0.5초 간격으로 5초 동안 10번 반짝임
    }

    function endGame() {
        isGameRunning = false; bgm.pause(); clearInterval(fruitInterval);
        container.style.backgroundImage = `url('${ruiImages.ending}')`;
        document.getElementById("game-over").style.display = "flex";
        document.getElementById("final-score").innerText = "최종 점수: " + score;
    }
</script>
</body>
</html>
