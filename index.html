<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>전가서의 신과일 6단계 짤방 챌린지!</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #1a1a1a; color: white; text-align: center; margin: 0; overflow: hidden; touch-action: none; }
        h1 { margin: 8px 0; font-size: 20px;}
        #game-container { position: relative; width: 90vw; max-width: 450px; height: 70vh; background: #222; margin: 10px auto; border: 3px solid #555; border-radius: 10px; overflow: hidden; }
        #player { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 80px; height: 80px; z-index: 10; background-size: cover; background-position: center; border-radius: 50%; border: 4px solid white; box-shadow: 0 0 20px rgba(255,255,255,0.8); transition: transform 0.1s; }
        .fruit { position: absolute; font-size: 24px; top: -50px; text-align: center; }
        #score-board { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 20px; border-radius: 20px; display: none; z-index: 20; }
        button { margin-top: 20px; padding: 15px 40px; font-size: 20px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🍋 전가서 신과일 챌린지 🍋</h1>
    <div id="score-board">점수: <span id="score">0</span> | 최고: <span id="high-score">0</span></div>
    <audio id="bgm" src="배경음악.mp3" loop></audio>
    <div id="game-container"><div id="player"></div><div id="game-over"><h2>기절 😵</h2><p id="final-score">점수: 0</p><button onclick="location.reload()">다시 도전</button></div></div>

<script>
    const container = document.getElementById("game-container");
    const player = document.getElementById("player");
    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("high-score");
    const gameOverEl = document.getElementById("game-over");
    const finalScoreEl = document.getElementById("final-score");
    const bgm = document.getElementById("bgm");

    let score = 0, isGameOver = false;
    const ruiImages = { normal: 'normal.jpg', level1: 'level1.jpg', level2: 'level2.jpg', level3: 'level3.jpg', pain: 'pain.jpg', ending: 'ending.jpg' };
    player.style.backgroundImage = `url('${ruiImages.normal}')`;

    // 터치/마우스 이동
    function movePlayer(clientX) {
        if (isGameOver) return;
        const rect = container.getBoundingClientRect();
        let x = clientX - rect.left - 40;
        x = Math.max(0, Math.min(x, rect.width - 80));
        player.style.left = x + "px";
        player.style.transform = "none";
    }
    container.addEventListener("mousemove", (e) => movePlayer(e.clientX));
    container.addEventListener("touchmove", (e) => { e.preventDefault(); movePlayer(e.touches[0].clientX); }, {passive: false});

    // 모바일 오디오 제한 해제 (첫 터치/클릭 시 음악 재생)
    function playAudioOnce() {
        bgm.play().catch(() => {});
        document.removeEventListener("touchstart", playAudioOnce);
        document.removeEventListener("click", playAudioOnce);
    }
    document.addEventListener("touchstart", playAudioOnce);
    document.addEventListener("click", playAudioOnce);

    function createFruit() {
        if (isGameOver) return;
        const fruit = document.createElement("div");
        fruit.classList.add("fruit");
        const rand = Math.random();
        let type = rand < 0.5 ? { emoji: '🍍', score: 10, speed: 5, stage: 'level1' } :
                   rand < 0.8 ? { emoji: '🍑🍑', score: 20, speed: 6, stage: 'level2' } :
                   rand < 0.95 ? { emoji: '🥝🥝🥝', score: 50, speed: 7, stage: 'level3' } :
                   { emoji: '🍎🍎🍎🍎', score: -100, speed: 10, stage: 'pain', isPain: true };

        fruit.innerText = type.emoji;
        fruit.style.left = Math.random() * (container.offsetWidth - 30) + "px";
        container.appendChild(fruit);

        let fruitY = -50;
        const fall = setInterval(() => {
            if (isGameOver) { clearInterval(fall); return; }
            fruitY += type.speed;
            fruit.style.top = fruitY + "px";
            const pRect = player.getBoundingClientRect(), fRect = fruit.getBoundingClientRect();
            if (fRect.left < pRect.right && fRect.right > pRect.left && fRect.top < pRect.bottom && fRect.bottom > pRect.top) {
                if (type.isPain) { endGame(); }
                else { score += type.score; scoreEl.innerText = score; player.style.backgroundImage = `url('${ruiImages[type.stage]}')`; setTimeout(() => player.style.backgroundImage = `url('${ruiImages.normal}')`, 300); }
                container.removeChild(fruit); clearInterval(fall);
            }
            if (fruitY > container.offsetHeight) { container.removeChild(fruit); clearInterval(fall); }
        }, 20);
    }

    function endGame() {
        isGameOver = true;
        bgm.pause();
        player.style.backgroundImage = `url('${ruiImages.pain}')`;
        setTimeout(() => { player.style.backgroundImage = `url('${ruiImages.ending}')`; gameOverEl.style.display = "block"; finalScoreEl.innerText = "최종 점수: " + score; }, 500);
    }

    // 게임 시작 (과일 생성 루프)
    setInterval(createFruit, 1000);
</script>
</body>
</html>
